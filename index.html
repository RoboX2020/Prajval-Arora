      @keyframes pixel-walk {
        0% { transform: translateX(-80px) translateY(0); }
        50% { transform: translateX(calc(100vw - 80px)) translateY(-8px); }
        100% { transform: translateX(-80px) translateY(0); }

      @keyframes pixel-walk-rev {
        0% { transform: translateX(100vw) translateY(0) scaleX(-1); }

      }
      @keyframes pixel-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-14px); }

      .pixel-walk { animation: pixel-walk 28s steps(48) infinite; }
      .pixel-walk-rev { animation: pixel-walk-rev 34s steps(56) infinite; }

      /* --- HOME PAGE EFFECTS --- */
      @keyframes noise {

        30% { background-position: 7% -25%; }

        70% { background-position: 0% 15%; }

      .bg-noise {
        position: fixed;
        top: -50%;
        left: -50%;
        right: -50%;
        bottom: -50%;
        width: 200%;
        height: 200vh;
        background: transparent url('http://assets.iceable.com/img/noise-transparent.png') repeat 0 0;
        background-repeat: repeat;
        animation: noise .2s infinite;
        opacity: 0.05;
        pointer-events: none;
        z-index: 10;
      }

      .scanlines {
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.2) 50%,
          rgba(0,0,0,0.2)
        );
        background-size: 100% 4px;
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        z-index: 20;
        pointer-events: none;
      }

      .glitch {
        position: relative;
        color: white;
      }
      .glitch::before,
      .glitch::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .glitch::before {
        left: 2px;
        text-shadow: -1px 0 #ff00c1;
        clip: rect(44px, 450px, 56px, 0);
        animation: glitch-anim 5s infinite linear alternate-reverse;
      }
      .glitch::after {
        left: -2px;
        text-shadow: -1px 0 #00fff9;
        clip: rect(44px, 450px, 56px, 0);
        animation: glitch-anim2 5s infinite linear alternate-reverse;
      }

      @keyframes glitch-anim {
        0% { clip: rect(33px, 9999px, 11px, 0); }
        20% { clip: rect(87px, 9999px, 96px, 0); }
        40% { clip: rect(10px, 9999px, 83px, 0); }
        60% { clip: rect(22px, 9999px, 6px, 0); }
        80% { clip: rect(54px, 9999px, 36px, 0); }
        100% { clip: rect(12px, 9999px, 68px, 0); }

      @keyframes glitch-anim2 {
