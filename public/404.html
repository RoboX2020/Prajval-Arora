<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — Prajval Arora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=IBM+Plex+Mono:wght@400&family=Outfit:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      html, body { min-height: 100%; margin: 0; background: #1c1814; color: #e6d9c4; font-family: Outfit, sans-serif; }
      main { max-width: 40rem; margin: 0 auto; padding: 6rem 1.25rem; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: #d4b87a; }
      h1 { font-family: "Cormorant Garamond", Georgia, serif; font-size: clamp(2.5rem, 7vw, 4.5rem); line-height: 0.95; color: #f0e6d4; margin: 1rem 0 0; font-weight: 600; }
      p { max-width: 32rem; line-height: 1.6; color: #b8a894; }
      a { display: inline-flex; margin: 0.35rem 0.35rem 0 0; padding: 0.75rem 1.25rem; font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; text-decoration: none; }
      .gold { background: #c4a35a; color: #1c1814; }
      .line { border: 1px solid rgba(196, 163, 90, 0.4); color: #e6d9c4; }
    </style>
  </head>
  <body>
    <main>
      <p class="mono">Error 404</p>
      <h1>This joint does not exist.</h1>
      <p>That address is not on this map. The current site, the circuit atlas, and the garage still are.</p>
      <p>
        <a class="gold" href="/">Current site</a>
        <a class="line" href="/v1">Circuit atlas</a>
      </p>
    </main>
  </body>
</html>
